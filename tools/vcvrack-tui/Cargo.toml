[package]
name = "vcvrack-tui"
version = "0.1.0"
edition = "2021"
description = "A terminal user interface client for VCV Rack"
authors = ["VCV Rack Contributors"]
license = "GPL-3.0"
repository = "https://github.com/VCVRack/Rack"
keywords = ["vcv", "rack", "synthesizer", "tui", "terminal"]
categories = ["multimedia::audio", "command-line-interface"]

[dependencies]
# TUI framework
ratatui = "0.29"
crossterm = "0.28"

# Async runtime and HTTP
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.12", features = ["json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Fuzzy matching for completion
fuzzy-matcher = "0.3"

# Configuration
directories = "5.0"
toml = "0.8"

# CLI parsing
clap = { version = "4", features = ["derive"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

[profile.release]
lto = true
strip = true
codegen-units = 1
panic = "abort"

[[bin]]
name = "vcvrack-tui"
path = "src/main.rs"
